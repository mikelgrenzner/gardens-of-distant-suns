<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" id="themeColor" content="#0c2a26">
  <title>Gardens of Distant Suns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
  <style>
    /* Every color here is rewritten by script when the palette or style changes. */
    :root {
      color-scheme: dark;
      --bg: #0c2a26; --bg-hi: #183f3a; --line: #2e6b63; --ink: #f0faf8; --ink-soft: #b4cfca;
      --c: #4bf2d1; --c-ink: #0d211e; --a: #f93f8f; --a-ink: #210d15; --b: #f9a64d; --b-ink: #211a0d;
      --wash: .24;
      --display: "Unbounded", "Arial Black", "Helvetica Neue", Arial, sans-serif;
      --ui: "Instrument Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --fade: .9s ease;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background-color: var(--bg); color: var(--ink);
      /* nebulae: soft washes of the palette's accents over a dark ground */
      background-image:
        radial-gradient(60% 50% at 88% 0%, color-mix(in srgb, var(--a) calc(var(--wash) * 100%), transparent), transparent 70%),
        radial-gradient(60% 55% at 0% 100%, color-mix(in srgb, var(--b) calc(var(--wash) * 85%), transparent), transparent 70%),
        radial-gradient(45% 40% at 30% 12%, color-mix(in srgb, var(--c) calc(var(--wash) * 45%), transparent), transparent 70%),
        linear-gradient(115deg, transparent 30%, color-mix(in srgb, var(--ink) 4%, transparent) 48%, transparent 66%);
      background-attachment: fixed;
      font: 500 16px/1.45 var(--ui);
      transition: background-color var(--fade), color var(--fade);
      -webkit-font-smoothing: antialiased;
    }
    [hidden] { display: none !important; }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

    #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    #sky .twinkle { animation: twinkle 5s ease-in-out infinite; }

    .app {
      position: relative; z-index: 1;
      min-height: 100vh; min-height: 100dvh;
      padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px));
      display: flex; flex-direction: column; gap: 14px;
    }
    .top { display: flex; align-items: flex-end; gap: 10px 18px; flex-wrap: wrap; }
    .mark { font: 800 1.25rem/1 var(--display); letter-spacing: -.02em; margin: 0 0 11px; color: var(--c); transition: color var(--fade); }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; flex: 1 1 420px; min-width: 0; }
    .pick { display: grid; gap: 4px; flex: 1 1 140px; min-width: 0; max-width: 230px; }
    .label { font-weight: 600; color: var(--ink-soft); font-size: .8125rem; }
    select {
      width: 100%; border: 2px solid var(--line); background: var(--bg); padding: 9px 12px; border-radius: 4px; font-weight: 600;
      transition: background-color var(--fade), border-color var(--fade);
    }
    select:hover { border-color: var(--ink); }
    .tools { display: flex; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .btn {
      border: 2px solid var(--line); background: transparent; color: var(--ink);
      padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: .875rem; line-height: 1.2;
      transition: background-color .2s, border-color var(--fade), color var(--fade);
    }
    .btn:hover { background: var(--bg-hi); }
    .btn[aria-pressed="true"] { background: var(--b); border-color: var(--b); color: var(--b-ink); }

    .hud { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
    .stock { border-radius: 999px; padding: 6px 16px; font-weight: 600; display: flex; align-items: baseline; gap: 8px;
             transition: background-color var(--fade), color var(--fade); }
    .stock b { font: 700 1.05rem/1.2 var(--display); font-variant-numeric: tabular-nums; }
    .stock small { font-size: .75rem; opacity: .8; font-variant-numeric: tabular-nums; }
    .stock.energy { background: var(--a); color: var(--a-ink); }
    .stock.life { background: var(--c); color: var(--c-ink); }
    .stock.information { background: var(--b); color: var(--b-ink); }
    .progress { flex: 1 1 260px; min-width: 0; display: grid; gap: 5px; }
    .progress .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 14px; font-weight: 600; font-size: .9375rem; }
    #count { color: var(--ink-soft); }
    .track { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 12%, transparent); overflow: hidden; }
    #meter { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--c), var(--a), var(--b)); transition: width .25s linear; }

    #afterglow { background: color-mix(in srgb, var(--bg-hi) 85%, transparent); border: 2px solid var(--line); border-radius: 12px;
                 padding: 12px 16px; max-width: 620px; display: flex; gap: 16px; align-items: center; }
    #afterglow h2 { margin: 0 0 2px; font: 700 1rem/1.2 var(--display); color: var(--b); }
    #afterglow p { margin: 0; color: var(--ink-soft); }

    .fieldbox { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; }
    #garden { width: 100%; height: auto; max-height: calc(100dvh - 215px); min-height: 280px; display: block; overflow: visible; }
    .tile { transform-box: fill-box; transform-origin: center; transition: fill var(--fade), stroke var(--fade), filter .2s; }
    .tile.frontier { cursor: pointer; }
    .tile.frontier:hover, .tile.frontier:focus-visible { filter: brightness(1.5); outline: none; }
    @keyframes breathe { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.45); } }
    #garden.ready .tile.frontier { animation: breathe 2.2s ease-in-out infinite; }
    #garden.ready .tile.frontier:hover { animation: none; filter: brightness(1.7); }
    @keyframes pop { 0% { transform: scale(.7); filter: brightness(1.8); } 55% { transform: scale(1.1); filter: brightness(1.4); } 100% { transform: scale(1); filter: none; } }
    .tile.pop { animation: pop .7s ease both; }
    .legend { margin: 0; color: var(--ink-soft); font-size: .9375rem; }

    @media (prefers-reduced-motion: reduce) {
      #sky .twinkle, #garden.ready .tile.frontier, .tile.pop { animation: none; }
    }
  </style>
</head>
<body>
  <svg id="sky" aria-hidden="true"></svg>
  <div class="app">
    <header class="top">
      <h1 class="mark">Gardens of Distant Suns</h1>
      <div class="bar">
        <label class="pick"><span class="label">Pattern</span><select id="selPattern"></select></label>
        <label class="pick"><span class="label">Palette</span><select id="selPalette"></select></label>
        <label class="pick"><span class="label">Style</span><select id="selScheme"></select></label>
      </div>
      <div class="tools">
        <button class="btn" id="previewBtn" type="button" aria-pressed="false" title="Show every tile lit, to compare palettes and patterns. Your garden is not affected.">Preview colors</button>
        <button class="btn" id="resetBtn" type="button">Start over</button>
      </div>
    </header>

    <section id="afterglow" hidden>
      <div>
        <h2>Afterglow</h2>
        <p id="afterglow-text"></p>
      </div>
      <button class="btn" id="afterglow-close" type="button">Continue</button>
    </section>

    <div class="hud">
      <div class="stock energy">Energy <b id="stock-energy">0</b><small id="rate-energy"></small></div>
      <div class="stock life">Life <b id="stock-life">0</b><small id="rate-life"></small></div>
      <div class="stock information">Information <b id="stock-information">0</b><small id="rate-information"></small></div>
      <div class="progress">
        <div class="row"><span id="next"></span><span id="count"></span></div>
        <div class="track"><div id="meter"></div></div>
      </div>
    </div>

    <div class="fieldbox">
      <svg id="garden" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Your garden of suns"></svg>
    </div>
    <p class="legend" id="legend"></p>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
