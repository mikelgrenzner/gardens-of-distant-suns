<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gardens of Distant Suns</title>
  <style>
    :root { --bg: #0f1226; --panel: #171b36; --text: #e9e6dc; --muted: #9a9cb3; --gold: #f2c14e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
           display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 16px; }
    h1 { margin: 0; font-weight: 500; font-size: 22px; letter-spacing: 0.02em; }
    .hud { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .stock { background: var(--panel); border-radius: 10px; padding: 8px 14px; min-width: 130px; }
    .stock .label { color: var(--muted); font-size: 13px; }
    .stock .value { font-size: 20px; font-variant-numeric: tabular-nums; }
    .stock .rate { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .energy .value { color: #ff8a7a; } .life .value { color: #8fe39a; } .information .value { color: #8ab8ff; }
    #garden { width: min(100%, 900px); height: auto; border-radius: 12px; display: block; }
    #garden .playable { cursor: pointer; }
    #garden .playable:hover { filter: brightness(1.15); }
    .tier { color: var(--muted); } .tier strong { color: var(--gold); font-weight: 500; }
    #afterglow { background: var(--panel); border: 1px solid #2b3160; border-radius: 12px;
                 padding: 14px 18px; max-width: 520px; display: flex; gap: 16px; align-items: center; }
    #afterglow[hidden] { display: none; }
    #afterglow h2 { margin: 0 0 4px; font-size: 16px; font-weight: 500; color: var(--gold); }
    #afterglow p { margin: 0; color: var(--muted); }
    button { font: inherit; color: var(--text); background: transparent; border: 1px solid #3a4070;
             border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    button:hover { background: #222850; }
  </style>
</head>
<body>
  <h1>Gardens of Distant Suns</h1>

  <section id="afterglow" hidden>
    <div>
      <h2>Afterglow</h2>
      <p id="afterglow-text"></p>
    </div>
    <button id="afterglow-close" type="button">Continue</button>
  </section>

  <div class="hud">
    <div class="stock energy"><div class="label">Energy</div><div class="value" id="stock-energy">0</div><div class="rate" id="rate-energy"></div></div>
    <div class="stock life"><div class="label">Life</div><div class="value" id="stock-life">0</div><div class="rate" id="rate-life"></div></div>
    <div class="stock information"><div class="label">Information</div><div class="value" id="stock-information">0</div><div class="rate" id="rate-information"></div></div>
  </div>

  <svg id="garden" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your garden of systems"></svg>
  <div class="tier">Origin system: <strong id="tier">Latent</strong></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
